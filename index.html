
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WALKER // VIDEO PROTOCOL</title>

    <link rel="icon" href="WALKER%20TUBE.JPEG" type="image/jpeg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace;
        }

        :root {
            --bg: #0b0c10;
            --panel: #111820;
            --border: #1f2833;
            --blue: #66fcf1;
            --green: #45a29e;
            --white: #ffffff;
            --text: #c5c6c7;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            width: 100%;
            min-height: 76px;
            padding: 14px 24px;
            background: rgba(11, 12, 16, 0.97);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--white);
            text-decoration: none;
            font-size: clamp(15px, 2vw, 22px);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
            white-space: nowrap;
        }

        .search-box {
            width: min(100%, 340px);
            padding: 12px 14px;
            color: var(--white);
            background: #101820;
            border: 1px solid var(--green);
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }

        .search-box:focus {
            border-color: var(--blue);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        .video-player-area {
            flex: 2;
            min-width: 0;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--green);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.12);
            overflow: hidden;
        }

        .video-wrapper video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-info {
            margin-top: 15px;
            padding: 18px;
            background: rgba(31, 40, 51, 0.35);
            border-left: 3px solid var(--blue);
            overflow-wrap: anywhere;
        }

        .video-title {
            color: var(--white);
            font-size: clamp(18px, 2vw, 24px);
            margin-bottom: 10px;
        }

        .video-desc {
            color: var(--green);
            font-size: 13px;
            line-height: 1.7;
        }

        .video-sidebar {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title {
            color: var(--blue);
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .video-card {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px;
            text-align: left;
            color: var(--text);
            background: rgba(26, 34, 43, 0.6);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .video-card:hover,
        .video-card:focus-visible {
            border-color: var(--blue);
            background: #17242d;
            outline: none;
        }

        .video-card.active {
            border-color: var(--blue);
            box-shadow: inset 3px 0 var(--blue);
        }

        .thumbnail {
            width: 120px;
            aspect-ratio: 16 / 9;
            flex-shrink: 0;
            background-color: #000;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--green);
        }

        .card-info {
            min-width: 0;
        }

        .card-title {
            color: var(--white);
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .card-author {
            margin-top: 6px;
            color: var(--green);
            font-size: 10px;
            letter-spacing: 1px;
        }

        .empty-message,
        .status-message {
            padding: 16px;
            color: var(--green);
            border: 1px dashed var(--border);
            font-size: 13px;
            line-height: 1.6;
        }

        .status-message {
            margin-top: 10px;
        }

        [hidden] {
            display: none !important;
        }

        @media (min-width: 900px) {
            .main-container {
                flex-direction: row;
                align-items: flex-start;
            }

            .video-sidebar {
                max-width: 420px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo {
                text-align: center;
                white-space: normal;
            }

            .search-box {
                width: 100%;
                max-width: none;
            }

            .main-container {
                padding: 14px;
                gap: 20px;
            }

            .video-info {
                padding: 13px;
            }

            .thumbnail {
                width: 105px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="#" class="logo">◢ WALKER // TUBE ◣</a>

        <input
            type="search"
            id="searchBar"
            class="search-box"
            placeholder="Pesquisar vídeos..."
            aria-label="Pesquisar vídeos"
            autocomplete="off"
        >
    </header>

    <main class="main-container">

        <section class="video-player-area" aria-label="Reprodutor de vídeo">

            <div class="video-wrapper">
                <video
                    id="main-video-player"
                    controls
                    autoplay
                    muted
                    playsinline
                    preload="metadata"
                >
                    Seu navegador não suporta a reprodução de vídeos.
                </video>
            </div>

            <div class="video-info">
                <h1 class="video-title" id="player-title">
                    WALKER // TUBE
                </h1>

                <p class="video-desc" id="player-desc">
                    Selecione um arquivo para iniciar a transmissão.
                </p>

                <p
                    class="status-message"
                    id="player-status"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>
            </div>

        </section>

        <aside class="video-sidebar">

            <h2 class="sidebar-title">// ARQUIVOS DE VÍDEO</h2>

            <div id="playlist-container"></div>

            <p id="empty-message" class="empty-message" hidden>
                Nenhum vídeo encontrado. Tente outra pesquisa.
            </p>

        </aside>

    </main>

    <script>
        // ==========================================
        // BANCO DE DADOS DOS VÍDEOS
        // ==========================================
        // Os vídeos e as imagens devem estar nos
        // caminhos indicados nos campos file e thumb.

        const VIDEOS_DATA = [
            {
                file: "Alan Walker - Darkside (feat. Au_Ra and Tomine Harket).mp4",
                title: "Alan Walker - Darkside",
                desc: "Darkside — Alan Walker, Au/Ra e Tomine Harket.",
                thumb: "Darkside.jpeg"
            },
            {
                file: "Alan Walker, Sabrina Carpenter & Farruko  - On My Way.mp4",
                title: "Alan Walker, Sabrina Carpenter & Farruko - On My Way",
                desc: "On My Way — Alan Walker, Sabrina Carpenter e Farruko.",
                thumb: "On My Way.jpeg"
            },
            {
                file: "Alan Walker, Ava Max - FATE (Official Lyric Video).mp4",
                title: "Alan Walker, Ava Max - FATE",
                desc: "FATE — vídeo de Alan Walker e Ava Max.",
                thumb: "Fate.jpeg"
            },
            {
                file: "Alan Walker - Alone.mp4",
                title: "Alan Walker - Alone",
                desc: "Alone — Alan Walker.",
                thumb: "alone.jpeg"
            }
        ];

        // ==========================================
        // ELEMENTOS DA PÁGINA
        // ==========================================

        const playlistContainer =
            document.getElementById("playlist-container");

        const mainVideoPlayer =
            document.getElementById("main-video-player");

        const playerTitle =
            document.getElementById("player-title");

        const playerDesc =
            document.getElementById("player-desc");

        const playerStatus =
            document.getElementById("player-status");

        const searchBar =
            document.getElementById("searchBar");

        const emptyMessage =
            document.getElementById("empty-message");

        let currentVideoIndex = -1;

        // ==========================================
        // MENSAGENS DO PLAYER
        // ==========================================

        function showStatus(message) {
            playerStatus.textContent = message;
            playerStatus.hidden = !message;
        }

        // ==========================================
        // REPRODUZIR UM VÍDEO
        // ==========================================

        function playVideo(index) {
            const video = VIDEOS_DATA[index];

            if (!video) return;

            currentVideoIndex = index;

            playerTitle.textContent = video.title;
            playerDesc.textContent = video.desc;

            showStatus("Carregando arquivo de vídeo...");

            mainVideoPlayer.pause();
            mainVideoPlayer.src = video.file;
            mainVideoPlayer.load();

            // Atualiza o destaque da lista.
            document.querySelectorAll(".video-card").forEach(card => {
                const isActive =
                    Number(card.dataset.index) === index;

                card.classList.toggle("active", isActive);

                if (isActive) {
                    card.setAttribute("aria-current", "true");
                } else {
                    card.removeAttribute("aria-current");
                }
            });

            // Alguns navegadores bloqueiam o autoplay.
            // Nesse caso, o usuário pode apertar Play.
            const playPromise = mainVideoPlayer.play();

            if (playPromise && typeof playPromise.catch === "function") {
                playPromise.catch(() => {
                    showStatus(
                        "Vídeo selecionado. Pressione Play para reproduzir."
                    );
                });
            }
        }

        // ==========================================
        // EVENTOS DO PLAYER
        // ==========================================

        mainVideoPlayer.addEventListener("loadeddata", () => {
            showStatus("");
        });

        mainVideoPlayer.addEventListener("playing", () => {
            showStatus("");
        });

        mainVideoPlayer.addEventListener("waiting", () => {
            showStatus("Carregando vídeo...");
        });

        mainVideoPlayer.addEventListener("error", () => {
            if (currentVideoIndex !== -1) {
                showStatus(
                    "Não foi possível carregar o vídeo. Verifique o nome, " +
                    "o caminho do arquivo e o formato."
                );
            }
        });

        // ==========================================
        // CONSTRUIR A LISTA DE VÍDEOS
        // ==========================================

        function renderPlaylist() {
            playlistContainer.replaceChildren();

            VIDEOS_DATA.forEach((video, index) => {
                const card = document.createElement("button");

                card.type = "button";
                card.className = "video-card";
                card.dataset.index = String(index);

                card.setAttribute(
                    "aria-label",
                    "Reproduzir " + video.title
                );

                const thumbnail = document.createElement("div");
                thumbnail.className = "thumbnail";
                thumbnail.setAttribute("aria-hidden", "true");

                if (video.thumb) {
                    thumbnail.style.backgroundImage =
                        'url("' +
                        video.thumb.replace(/["\\]/g, "\\$&") +
                        '")';
                }

                const info = document.createElement("div");
                info.className = "card-info";

                const title = document.createElement("div");
                title.className = "card-title";
                title.textContent = video.title;

                const author = document.createElement("div");
                author.className = "card-author";
                author.textContent = "ARQUIVO INTERNO";

                info.append(title, author);
                card.append(thumbnail, info);

                card.addEventListener("click", () => {
                    playVideo(index);
                });

                playlistContainer.appendChild(card);
            });

            filterVideos();
        }

        // ==========================================
        // PESQUISA FUNCIONAL
        // ==========================================

        function filterVideos() {
            const query = searchBar.value
                .trim()
                .toLocaleLowerCase("pt-BR");

            const cards =
                playlistContainer.querySelectorAll(".video-card");

            let visibleCount = 0;

            cards.forEach(card => {
                const index = Number(card.dataset.index);
                const video = VIDEOS_DATA[index];

                const searchableText =
                    video.title + " " + video.desc;

                const matches = searchableText
                    .toLocaleLowerCase("pt-BR")
                    .includes(query);

                card.hidden = !matches;

                if (matches) {
                    visibleCount++;
                }
            });

            emptyMessage.hidden = visibleCount !== 0;
        }

        searchBar.addEventListener("input", filterVideos);

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================

        renderPlaylist();

        if (VIDEOS_DATA.length > 0) {
            playVideo(0);
        } else {
            playerTitle.textContent = "Nenhum vídeo cadastrado";
            playerDesc.textContent =
                "Adicione vídeos à lista VIDEOS_DATA no código.";
        }
    </script>

</body>
</html>
